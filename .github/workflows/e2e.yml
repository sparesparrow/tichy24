name: Checkout e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jednorazova databaze bez hesla. Cypress tady objednava jen demo zbozi.
env:
  DATABASE_URL: postgresql://tichy24@localhost:5432/tichy24_ci
  AUTH_SECRET: ci-only-not-a-real-secret-000000000000000=
  RATE_LIMIT_SECRET: ci-only-rate-limit-secret-for-tests
  AUTH_TRUST_HOST: "true"
  SITE_URL: http://localhost:3000
  ADMIN_PASSWORD: ci-admin-password-12
  SEED_DEMO_PRODUCTS: "1"
  CYPRESS_BASE_URL: http://localhost:3000

jobs:
  cypress:
    name: Cypress checkout
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tichy24
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tichy24_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tichy24 -d tichy24_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install app dependencies
        run: npm ci

      # Cypress neni v lockfile, aby npm ci zustal platny. Verze je pripnuta tady.
      - name: Install Cypress
        run: npm install --no-save --no-package-lock cypress@14.5.4 && npx cypress install

      - name: Generate Prisma client and migrate
        run: npx prisma generate && npx prisma migrate deploy

      - name: Seed demo catalog
        run: npm run db:seed

      # next dev, ne next start: produkcni cookie je Secure a na http by kosik zmizel.
      - name: Run checkout specs
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: electron
          start: npm run dev
          wait-on: http://localhost:3000
          wait-on-timeout: 180
